services:
  postgres:
    image: postgres:16-alpine
    container_name: hammer-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hammer_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hammer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hammer_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hammer_postgres_data:
